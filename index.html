25%,#bcf2b070,#67b98c2c 24%,#204f3840 44%,transparent 70%);filter:blur(2px);pointer-events:none;animation:float 11s infinite ease-in-out}.orb:after{content:"";position:absolute;inset:38px;border:1px solid #a9e9b04a;border-radius:50%;box-shadow:0 0 40px #a9e9b044,inset -24px -15px 35px #4fa37b2a}@keyframes float{50%{transform:translateY(35px) rotate(11deg)}}@keyframes breathe{50%{box-shadow:inset 0 1px #fff2,0 18px 45px #0008}}@media(max-width:920px){.split{grid-template-columns:1fr}.layout{grid-template-columns:190px 1fr}}@media(max-width:680px){.page{padding:16px 12px 40px}.tagline{margin-top:60px}.hero{letter-spacing:-3px}.intro{font-size:14px;margin-bottom:30px}.layout{display:block}.nav{display:flex;overflow-x:auto;gap:8px;margin-bottom:15px;padding:9px}.group{display:none}.navbtn{flex:none;width:auto;padding:11px;font-size:12px}.panel{padding:18px}.fields{gap:10px}.orb{opacity:.3}.result{min-height:235px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><div class="orb"></div><div class="page"><div class="head"><div class="logo">✦</div>verdant<span style="color:#94b9a0;font-weight:450">finance</span></div><div class="tagline">THE FINANCIAL WORKSPACE</div><h1 class="hero">Numbers, in<br><em>their element.</em></h1><p class="intro">Precision tools for investing, trading and taxes. Beautifully engineered, instantly calculated.</p><div class="layout"><nav class="nav" id="nav" aria-label="Calculator selection"></nav><main class="panel"><div class="eyebrow" id="category"></div><h2 id="title"></h2><p class="desc" id="desc"></p><div class="split"><section><div class="fields" id="fields"></div><div class="actions"><button class="btn" id="save">Save scenario ↗</button><button class="btn alt" id="reset">Reset</button><button class="btn alt" id="copy">Copy result</button></div><div class="error" id="error" role="alert"></div><div class="notice" id="notice"></div><div class="saved" id="saved"></div></section><section class="result"><div><div class="label" id="resultLabel"></div><div class="number" id="primary"></div><div id="chart"></div></div><div class="rows" id="rows"></div></section></div></main></div><p class="notice" style="margin-top:25px">© 2026 Verdant Finance · Local-first · Financial and tax estimates, not advice.</p></div><script type="module">
import * as F from './src/finance.js';
const field=(key,label,value)=>({key,label,value}),selection=(key,label,options)=>({key,label,options});
const tools=[
['stock','Stock profit','TRADING','Trading returns after fees and estimated gains tax',[field('buy','Buy price',150),field('sell','Sell price',185),field('qty','Shares',25),field('fee','Commission per side',2.5),field('tax','Tax estimate (%)',15)],F.stock,'afterTax'],
['average','Average cost','TRADING','Weighted share entry from three lots',[field('p1','First price',100),field('q1','First shares',10),field('p2','Second price',125),field('q2','Second shares',15),field('p3','Third price',135),field('q3','Third shares',5),field('fee','Total commissions',0)],F.average,'average'],
['compound','Compound growth','INVESTING','Project invested capital and returns',[field('start','Initial amount',10000),field('monthly','Monthly contribution',500),field('rate','Annual return (%)',8),field('years','Years',20)],F.compound,'futureValue'],
['dividend','Dividend income','INVESTING','Annual net distributions and yield',[field('shares','Shares',250),field('div','Annual dividend per share',2.8),field('price','Share price',45),field('withholding','Withholding (%)',15)],F.dividend,'annualNet'],
['position','Position sizing','TRADING','Size trades to a defined risk budget',[field('capital','Account value',20000),field('risk','Risk (%)',1),field('entry','Entry',125),field('stop','Stop loss',120)],F.position,'shares'],
['cagr','Annualized return','INVESTING','Compound annual growth rate',[field('initial','Initial',10000),field('final','Ending',18500),field('years','Years',5)],F.cagr,'annualReturnPercent'],
['federal','US federal tax · 2026','TAXES','2026 ordinary federal income tax estimate',[field('income','Gross income (USD)',85000),selection('status','Filing status',[['single','Single'],['joint','Married filing jointly'],['head','Head of household']]),field('extra','Extra deductions',0)],F.federal,'tax'],
['flat','Custom income tax','TAXES','Single-rate tax scenario',[field('income','Income',50000),field('allow','Exemption',10000),field('rate','Rate (%)',20),field('credit','Credits',0)],F.flat,'tax'],
['gain','Capital gains','TAXES','Realized gain with user-provided rate',[field('proceeds','Sale proceeds',15000),field('basis','Cost basis',10000),field('fee','Fees',30),field('losses','Loss offsets',0),field('rate','Assumed gain tax (%)',15)],F.gain,'tax'],
['vat','Sales tax / VAT','TAXES','Inclusive and exclusive sales tax',[field('price','Price',120),field('rate','Tax (%)',10),selection('included','Tax included in price?',[['no','No'],['yes','Yes']])],F.vat,'total'],
['loan','Loan payment','PLANNING','Monthly amortized installments',[field('principal','Loan amount',150000),field('rate','APR (%)',6.5),field('years','Years',20)],F.loan,'monthlyPayment'],
['inflation','Inflation & value','PLANNING','Purchasing power over time',[field('amount','Present amount',10000),field('rate','Inflation (%)',3),field('years','Years',10)],F.inflation,'futureCost'],

];const el=id=>document.getElementById(id);let active=tools[0],result=null;let snapshots=[];try{snapshots=JSON.parse(localStorage.getItem('verdant.saved')||'[]')}catch{}
function fmt(n,key){if(!Number.isFinite(n))return '—';return n.toLocaleString(undefined,{maximumFractionDigits:2,minimumFractionDigits:key==='shares'?0:2})+(key.toLowerCase().includes('percent')?'%':'')}
function label(k){return k.replace(/([A-Z])/g,' $1').replace(/^./,s=>s.toUpperCase())}
function show(id){active=tools.find(t=>t[0]===id)||tools[0];el('nav').innerHTML=tools.map(t=>'<button class="navbtn '+(t===active?'on':'')+'" data-tool="'+t[0]+'">'+t[1]+'</button>').join('');el('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.tool));el('category').textContent=active[2];el('title').textContent=active[1];el('desc').textContent=active[3];el('fields').innerHTML=active[4].map(f=>'<div class="field"><label for="'+f.key+'">'+f.label+'</label>'+(f.options?'<select id="'+f.key+'" data-key="'+f.key+'">'+f.options.map(([v,l])=>'<option value="'+v+'">'+l+'</option>').join('')+'</select>':'<input type="number" step="any" id="'+f.key+'" data-key="'+f.key+'" value="'+f.value+'">')+'</div>').join('');el('fields').querySelectorAll('input,select').forEach(e=>e.addEventListener('input',compute));el('notice').textContent=active[2]==='TAXES'?'Illustrative tax estimate only; excludes many jurisdiction-specific taxes, credits, and rules. The US model covers ordinary rates and standard deductions only.':'Estimates based on provided inputs. Not live market data or guaranteed returns.';compute();displaySaved()}
function values(){return Object.fromEntries([...el('fields').querySelectorAll('[data-key]')].map(e=>[e.dataset.key,e.tagName==='SELECT'?e.value:e.value===''?'':+e.value]))}
function compute(){try{result=active[5](values());el('error').textContent='';el('primary').textContent=fmt(result[active[6]],active[6]);el('resultLabel').textContent=label(active[6]).toUpperCase();el('rows').innerHTML=Object.entries(result).filter(([k,v])=>typeof v==='number'&&k!==active[6]).slice(0,5).map(([k,v])=>'<div class="row"><span>'+label(k)+'</span><b>'+fmt(v,k)+'</b></div>').join('');const series=result.series;if(series?.length>1){let max=Math.max(...series,1);let pts=series.map((v,i)=>(i/(series.length-1)*300).toFixed(1)+','+(95-v/max*88).toFixed(1)).join(' ');el('chart').innerHTML='<svg class="chart" viewBox="0 0 300 100" role="img" aria-label="Investment growth chart"><polyline points="'+pts+'" fill="none" stroke="#a7ef98" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'}else el('chart').innerHTML=''}catch(e){result=null;el('error').textContent=e.message;el('primary').textContent='—';el('rows').innerHTML='';el('chart').innerHTML=''}}
function displaySaved(){el('saved').innerHTML=snapshots.length?'Saved scenarios: '+snapshots.map((s,i)=>'<button data-i="'+i+'">'+s.name+'</button>').join(''):'';el('saved').querySelectorAll('button').forEach(b=>b.onclick=()=>{let s=snapshots[+b.dataset.i];show(s.id);Object.entries(s.data).forEach(([k,v])=>{let field=el('fields').querySelector('[data-key="'+k+'"]');if(field)field.value=v});compute()})}
el('reset').onclick=()=>show(active[0]);el('save').onclick=()=>{if(!result)return;snapshots.unshift({id:active[0],name:active[1],data:values()});snapshots=snapshots.slice(0,12);try{localStorage.setItem('verdant.saved',JSON.stringify(snapshots))}catch{}displaySaved()};el('copy').onclick=async()=>{if(!result)return;try{await navigator.clipboard.writeText(active[1]+'\n'+Object.entries(result).filter(([k,v])=>typeof v==='number').map(([k,v])=>label(k)+': '+fmt(v,k)).join('\n'));el('copy').textContent='Copied ✓';setTimeout(()=>el('copy').textContent='Copy result',1300)}catch{el('error').textContent='Clipboard access unavailable'}};show('stock');</script></body></html>
